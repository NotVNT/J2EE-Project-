name: CI

on:
	push:
		branches: [dev]
	pull_request:
		branches: [dev]
	workflow_dispatch:

concurrency:
	group: ci-dev-${{ github.ref }}
	cancel-in-progress: true

jobs:
	backend:
		name: Backend (Spring Boot)
		runs-on: ubuntu-latest
		defaults:
			run:
				shell: bash
				working-directory: backend
		steps:
			- name: Checkout
				uses: actions/checkout@v4

			- name: Detect backend build tool
				id: detect
				run: |
					if [ -f pom.xml ] || [ -f mvnw ]; then
						echo "tool=maven" >> "$GITHUB_OUTPUT"
					elif [ -f build.gradle ] || [ -f build.gradle.kts ] || [ -f gradlew ]; then
						echo "tool=gradle" >> "$GITHUB_OUTPUT"
					else
						echo "tool=none" >> "$GITHUB_OUTPUT"
					fi

			- name: Setup Java
				if: ${{ steps.detect.outputs.tool != 'none' }}
				uses: actions/setup-java@v4
				with:
					distribution: temurin
					java-version: '17'
					cache: ${{ steps.detect.outputs.tool }}

			- name: Maven - build & test
				if: ${{ steps.detect.outputs.tool == 'maven' }}
				run: |
					if [ -f mvnw ]; then chmod +x mvnw; ./mvnw -B -ntp verify; else mvn -B -ntp verify; fi

			- name: Gradle - build & test
				if: ${{ steps.detect.outputs.tool == 'gradle' }}
				run: |
					if [ -f gradlew ]; then chmod +x gradlew; ./gradlew build; else gradle build; fi

			- name: Skip (no backend build files)
				if: ${{ steps.detect.outputs.tool == 'none' }}
				run: echo "No backend build files found under ./backend (pom.xml/build.gradle). Skipping."

	frontend:
		name: Frontend (React Native)
		runs-on: ubuntu-latest
		defaults:
			run:
				shell: bash
				working-directory: frontend
		steps:
			- name: Checkout
				uses: actions/checkout@v4

			- name: Detect frontend
				id: detect
				run: |
					if [ -f package.json ]; then
						echo "has_frontend=true" >> "$GITHUB_OUTPUT"
					else
						echo "has_frontend=false" >> "$GITHUB_OUTPUT"
					fi

			- name: Setup Node
				if: ${{ steps.detect.outputs.has_frontend == 'true' }}
				uses: actions/setup-node@v4
				with:
					node-version: '20'

			- name: Cache npm/yarn
				if: ${{ steps.detect.outputs.has_frontend == 'true' }}
				uses: actions/cache@v4
				with:
					path: |
						~/.npm
						~/.cache/yarn
						~/.yarn/cache
					key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json', 'frontend/yarn.lock') }}
					restore-keys: |
						${{ runner.os }}-node-

			- name: Install deps
				if: ${{ steps.detect.outputs.has_frontend == 'true' }}
				env:
					CI: 'true'
				run: |
					if [ -f yarn.lock ]; then
						corepack enable
						yarn install --frozen-lockfile
					elif [ -f package-lock.json ]; then
						npm ci
					else
						npm install
					fi

			- name: Test
				if: ${{ steps.detect.outputs.has_frontend == 'true' }}
				env:
					CI: 'true'
				run: |
					if [ -f yarn.lock ]; then
						yarn test --if-present
					else
						npm test --if-present
					fi

			- name: Skip (no frontend package.json)
				if: ${{ steps.detect.outputs.has_frontend == 'false' }}
				run: echo "No frontend package.json found under ./frontend. Skipping."
